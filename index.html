<script>
// ===== DŹWIĘK (syntezowany w przeglądarce, bez plików) =====
const SND=(()=>{
  let ac=null,out=null,wet=null,loops=[],nodes=[],cache={};
  const R=Math.random;
  function init(ctx){
    if(!ac){
      ac=ctx||new (window.AudioContext||window.webkitAudioContext)();
      const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=6;comp.knee.value=6;comp.attack.value=0.001;
      comp.connect(ac.destination);
      out=ac.createGain();out.gain.value=0.7;out.connect(comp);
      // pogłos – wygenerowana odpowiedź impulsowa (duża jaskinia / plener)
      const rev=ac.createConvolver();rev.buffer=impulse(3.5,2.2);
      wet=ac.createGain();wet.gain.value=0.35;wet.connect(rev);rev.connect(comp);
    }
    if(ac.state!=='running'&&ac.resume) ac.resume();
  }
  const now=()=>ac.currentTime;
  function impulse(sec,decay){
    const n=ac.sampleRate*sec,b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*Math.pow(1-i/n,decay);}
    return b;
  }
  function buf(kind,sec=4){ // white / brown / pink szum
    const k=kind+sec;if(cache[k])return cache[k];
    const n=ac.sampleRate*sec,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    let last=0,b0=0,b1=0,b2=0;
    for(let i=0;i<n;i++){const w=R()*2-1;
      if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5}
      else if(kind==='pink'){b0=0.997*b0+w*0.029;b1=0.985*b1+w*0.032;b2=0.95*b2+w*0.048;d[i]=(b0+b1+b2+w*0.02)*1.6}
      else d[i]=w;}
    return cache[k]=b;
  }
  // węzeł: źródło szumu -> filtr -> wzmocnienie -> (dry + wet)
  function noise({kind='white',type='lowpass',freq=1000,q=0.7,vol=0.5,when=0,dur=1,att=0.005,loop=false,keep=false,send=0.3}){
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=now()+when;
    s.buffer=buf(kind,loop?4:Math.max(1,Math.ceil(dur+0.2)));s.loop=loop;
    f.type=type;f.frequency.setValueAtTime(freq,t);f.Q.value=q;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);
    if(!loop)g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);route(g,send);
    s.start(t,loop?R()*3:0);if(!loop)s.stop(t+dur+0.1);
    if(keep||loop)nodes.push(s);
    return {s,f,g,t};
  }
  function osc({type='sine',f1=440,f2=null,vol=0.3,when=0,dur=0.5,att=0.005,send=0.3,curve='exp'}){
    const o=ac.createOscillator(),g=ac.createGain(),t=now()+when;
    o.type=type;o.frequency.setValueAtTime(f1,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);route(g,send);o.start(t);o.stop(t+dur+0.1);
    return {o,g,t};
  }
  function route(node,send){node.connect(out);if(send){const s=ac.createGain();s.gain.value=send;node.connect(s);s.connect(wet);}}
  function dist(amount){const c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(x*amount)}const w=ac.createWaveShaper();w.curve=c;return w}
  function every(ms,fn,jitter=0){let alive=true;const tick=()=>{if(!alive)return;fn();loops.push(setTimeout(tick,ms+R()*jitter))};tick();loops.push({stop:()=>alive=false})}
  function stopAll(){
    loops.forEach(l=>l.stop?l.stop():clearTimeout(l));loops=[];
    nodes.forEach(n=>{try{n.stop(now()+0.05)}catch(e){}});nodes=[];
  }

  // ---------- realistyczne elementy ----------
  // bąbel: sinus o rosnącej wysokości (rezonans Minnaerta) z szybkim zanikiem
  function bubble(when=0,size=R()){
    const f=150+ (1-size)*700, d=0.04+size*0.12;
    const o=ac.createOscillator(),g=ac.createGain(),t=now()+when;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(1.6+R()*0.8),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12+size*0.15,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);route(g,0.25);o.start(t);o.stop(t+d+0.05);
  }
  function rockClick(when=0,vol=0.25){ // pojedynczy kamyk / trzask
    noise({type:'bandpass',freq:1500+R()*4000,q:3+R()*6,vol,when,dur:0.02+R()*0.06,att:0.001,send:0.5});
  }
  function bell(freq,when=0,vol=0.18){ // dzwonek – nieharmoniczne alikwoty
    [[1,1],[2.76,0.5],[5.4,0.25],[8.93,0.12]].forEach(([m,a],i)=>osc({f1:freq*m,vol:vol*a,when,dur:2.6/(i+1),att:0.002,send:0.5}));
  }
  function brass(freq,when,dur,vol=0.18){ // „trąbka”: piła przez filtr z narastającą jasnością
    const t=now()+when,o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
    o.type=o2.type='sawtooth';o.frequency.value=freq;o2.frequency.value=freq*1.004;
    f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(300,t);f.frequency.linearRampToValueAtTime(freq*6,t+0.06);f.frequency.linearRampToValueAtTime(freq*3,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.04);g.gain.setValueAtTime(vol,t+dur-0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.3);
    o.connect(f);o2.connect(f);f.connect(g);route(g,0.4);o.start(t);o2.start(t);o.stop(t+dur+0.4);o2.stop(t+dur+0.4);
  }
  function clap(when){noise({type:'bandpass',freq:1000+R()*1500,q:1.5,vol:0.08+R()*0.1,when,dur:0.03+R()*0.05,att:0.001,send:0.4})}

  // ---------- ekrany ----------
  function magma(){ // przekrój: gęste bulgotanie w komorze
    const base=noise({kind:'brown',type:'lowpass',freq:180,q:1,vol:0.35,loop:true,att:1,send:0.3});
    // powolne „falowanie” masy magmy
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=0.35;lg.gain.value=0.15;lfo.connect(lg);lg.connect(base.g.gain);lfo.start();nodes.push(lfo);
    every(70,()=>{if(R()<0.55)bubble(0,Math.pow(R(),1.5))},90);
    every(900,()=>{ // duży „blurp”
      const t=R()*0.3;osc({f1:70+R()*30,f2:160+R()*60,vol:0.35,when:t,dur:0.22,att:0.01,send:0.4});
      for(let i=0;i<4;i++)bubble(t+0.05+i*0.03,0.2+R()*0.3);
    },1400);
  }
  function quake(){ // sejsmograf: narastające podziemne dudnienie przez 12 s
    const r=noise({kind:'brown',type:'lowpass',freq:70,q:1.2,vol:0.06,loop:true,att:0.5,send:0.4});
    r.g.gain.cancelScheduledValues(now());r.g.gain.setValueAtTime(0.06,now());r.g.gain.linearRampToValueAtTime(0.9,now()+12);
    r.f.frequency.setValueAtTime(60,now());r.f.frequency.linearRampToValueAtTime(160,now()+12);
    const sub=ac.createOscillator(),sg=ac.createGain();sub.frequency.value=32;sg.gain.setValueAtTime(0.0001,now());sg.gain.exponentialRampToValueAtTime(0.35,now()+12);
    sub.connect(sg);route(sg,0);sub.start();nodes.push(sub);
    const start=now();
    every(400,()=>{ // wstrząsy i sypiące się kamyki – coraz częściej
      const k=Math.min(1,(now()-start)/12);
      if(R()<0.15+k*0.6){osc({f1:55+R()*20,f2:30,vol:0.2+k*0.4,dur:0.5+R()*0.6,att:0.03,send:0.5});
        for(let i=0;i<2+k*8;i++)rockClick(R()*0.6,0.05+k*0.15);}
    },300);
    every(2600,()=>{ // syrena ostrzegawcza (cicha, w tle)
      const t=now(),o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
      o.frequency.setValueAtTime(600,t);o.frequency.linearRampToValueAtTime(950,t+0.9);o.frequency.linearRampToValueAtTime(600,t+1.8);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+0.2);g.gain.exponentialRampToValueAtTime(0.0001,t+1.8);
      o.connect(g);route(g,0.5);o.start(t);o.stop(t+1.9);
    });
  }
  function tension(){ // przycisk ERUPCJA: bicie serca + niski pomruk
    noise({kind:'brown',type:'lowpass',freq:90,vol:0.25,loop:true,att:1.5,send:0.3});
    every(850,()=>{[0,0.22].forEach((d,i)=>{
      osc({f1:i?55:65,f2:30,vol:i?0.45:0.7,when:d,dur:0.2,att:0.008,send:0.2});
      noise({kind:'brown',type:'lowpass',freq:120,vol:i?0.2:0.3,when:d,dur:0.12,att:0.004,send:0.1});
    })});
  }
  function countdown(){ // 3-2-1: czyste piknięcia + narastający syk gazu
    [0,1,2].forEach(i=>{const f=i<2?784:1568;
      osc({f1:f,vol:0.3,when:i,dur:i<2?0.25:0.6,att:0.004,send:0.35});osc({f1:f*2,vol:0.05,when:i,dur:0.15,send:0.3});});
    const h=noise({type:'highpass',freq:3000,vol:0.0001,loop:true,send:0.2});
    h.g.gain.setValueAtTime(0.0001,now());h.g.gain.exponentialRampToValueAtTime(0.15,now()+2.9);
  }
  function eruption(){ // WYBUCH
    const t=now();
    // 1. trzask – ostry początek
    noise({type:'highpass',freq:1500,vol:0.9,dur:0.15,att:0.001,send:0.6});
    // 2. główny huk: szum przez przester, filtr zamyka się od jasnego do niskiego
    { const s=ac.createBufferSource(),f=ac.createBiquadFilter(),d=dist(3),g=ac.createGain();
      s.buffer=buf('white',6);f.type='lowpass';f.frequency.setValueAtTime(5000,t);f.frequency.exponentialRampToValueAtTime(400,t+0.6);f.frequency.exponentialRampToValueAtTime(70,t+5);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.01);g.gain.exponentialRampToValueAtTime(0.4,t+1);g.gain.exponentialRampToValueAtTime(0.0001,t+6);
      s.connect(f);f.connect(d);d.connect(g);route(g,0.7);s.start(t);s.stop(t+6.2); }
    // 3. fala uderzeniowa w basie
    osc({f1:110,f2:22,vol:1,dur:2.5,att:0.005,send:0.3});
    osc({type:'triangle',f1:70,f2:25,vol:0.5,dur:3.5,att:0.01,send:0.3});
    // 4. długie dudnienie erupcji
    noise({kind:'brown',type:'lowpass',freq:140,vol:0.8,dur:7,att:0.3,send:0.5});
    // 5. syczenie gazu i lawy
    noise({kind:'pink',type:'bandpass',freq:2500,q:0.6,vol:0.25,when:0.4,dur:6,att:0.6,send:0.4});
    // 6. kolejne mniejsze wybuchy
    [0.9,1.7,2.6,3.8].forEach((w,i)=>{osc({f1:90,f2:30,vol:0.5-i*0.08,when:w,dur:1,att:0.01,send:0.5});
      noise({type:'lowpass',freq:1200,vol:0.35-i*0.05,when:w,dur:0.6,att:0.002,send:0.6});});
    // 7. spadające kamienie i odłamki
    for(let i=0;i<60;i++)rockClick(0.5+Math.pow(R(),0.7)*5,0.08+R()*0.25);
  }
  function explain(){bell(880,0,0.15);bell(1318,0.18,0.12);}
  function finale(){ // ta-da + oklaski
    brass(392,0,0.14);brass(523,0.15,0.14);brass(659,0.3,0.14);brass(784,0.45,0.9,0.2);brass(523,0.45,0.9,0.12);
    const st=0.4;for(let i=0;i<260;i++){const w=st+Math.pow(R(),1.3)*4.2;clap(w);} // oklaski cichną
    noise({kind:'pink',type:'bandpass',freq:1800,q:0.5,vol:0.06,when:0.4,dur:4.5,att:0.3,send:0.4}); // szum widowni
  }
  return {
    init,
    tap(){if(!ac)return;osc({f1:1800,f2:900,vol:0.12,dur:0.04,att:0.001,send:0.1});noise({type:'bandpass',freq:2500,q:4,vol:0.12,dur:0.03,att:0.001,send:0.1})},
    back(){if(!ac)return;osc({f1:900,f2:500,vol:0.12,dur:0.06,att:0.001,send:0.1});noise({type:'bandpass',freq:1500,q:4,vol:0.1,dur:0.03,att:0.001,send:0.1})},
    screen(i){ if(!ac)return; stopAll();
      ({1:magma,2:quake,3:tension,4:countdown,5:eruption,6:explain,7:finale})[i]?.();
    },
    _ctx:()=>ac
  };
})();
// ===== /DŹWIĘK =====
// 0 start,1 przekrój,2 sejsmograf,3 erupcja,4 odliczanie,5 wybuch,6 jak to działa,7 koniec
const AUTO={4:3000,5:5000}; // ms, potem automatycznie dalej
const stage=document.getElementById('stage');
let cur=0,timer=null,lock=0;
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`translate(-50%,-50%) scale(${k})`}
function show(i){
  cur=(i+8)%8;clearTimeout(timer);
  stage.innerHTML=document.getElementById('s'+cur).innerHTML; // świeża kopia = animacje od zera
  if(cur>0&&!AUTO[cur]) stage.insertAdjacentHTML('beforeend','<div id="back"'+(cur===2?' class="top"':'')+'><svg viewBox="0 0 48 48" width="60" height="60"><path d="M40,24 L10,24 M22,10 L8,24 L22,38" fill="none" stroke="#F4EFE8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>');
  document.body.style.background=stage.firstElementChild.style.background;
  lock=Date.now()+600;
  if(AUTO[cur]) timer=setTimeout(()=>show(cur+1),AUTO[cur]);
  SND.screen(cur);
}
function next(){ if(Date.now()<lock||AUTO[cur]) return; show(cur+1); }
function prev(){ if(Date.now()<lock) return; show(cur===6?3:cur-1); } // z "Jak to działa" wraca do przycisku ERUPCJA
addEventListener('pointerdown',e=>{ SND.init(); const c=cur; if(e.target.closest('#back')){prev(); if(cur!==c)SND.back();} else {next(); if(cur!==c)SND.tap();} });
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') show(cur-1);
  else if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter') {lock=0;next()}
  else if(e.key==='Home'||e.key==='r') show(0);
  else if(e.key==='e') show(3);
});
addEventListener('resize',fit);
['gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('contextmenu',e=>e.preventDefault());
fit();show(0);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
